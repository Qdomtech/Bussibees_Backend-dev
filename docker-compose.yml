version: "3.8"

services:

  bussibees_backend:

    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}

    container_name: ${IMAGE_NAME}

    restart: unless-stopped

    ports:
      - "${PORT}:${PORT}"

    env_file:
      - .env

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      - mongo

    networks:
      - backend_net

    pull_policy: always



  mongo:

    image: mongo:6

    container_name: ${IMAGE_NAME}_mongo

    restart: unless-stopped

    volumes:
      - mongo_data:/data/db

    networks:
      - backend_net



networks:
  backend_net:
    driver: bridge


volumes:
  uploads_data:
  mongo_data:
